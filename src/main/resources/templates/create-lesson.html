<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Create Lesson</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4">Create New Lesson</h2>

        <form th:action="@{/lessons}" th:object="${lesson}" method="post">

            <div class="mb-3">
                <label class="form-label">Lesson Name</label>

                <input type="text"
                       th:field="*{name}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Code</label>

                <input type="text"
                       th:field="*{code}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Terms</label>

                <input type="number"
                       th:field="*{terms}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Type</label>

                <input type="text"
                       th:field="*{type}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Department</label>

                <input type="text"
                       th:field="*{department}"
                       class="form-control"
                       required>
            </div>

            <button type="submit" class="btn btn-primary">
                Save Lesson
            </button>

            <a href="/lessons" class="btn btn-secondary">
                Back
            </a>

        </form>

    </div>

</div>

</body>
</html>
