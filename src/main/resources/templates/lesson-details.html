<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Lesson Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow p-4 mb-4">

        <h2 class="mb-4">Lesson Details</h2>

        <p>
            <strong>Name:</strong>
            <span th:text="${lesson.name}"></span>
        </p>

        <p>
            <strong>Code:</strong>
            <span th:text="${lesson.code}"></span>
        </p>

        <p>
            <strong>Terms:</strong>
            <span th:text="${lesson.terms}"></span>
        </p>

        <p>
            <strong>Type:</strong>
            <span th:text="${lesson.type}"></span>
        </p>

        <p>
            <strong>Department:</strong>
            <span th:text="${lesson.department}"></span>
        </p>

    </div>

    <div class="card shadow p-4 mb-4">

        <h3 class="mb-4">Comments</h3>

        <div th:if="${#lists.isEmpty(lesson.comments)}">

            <div class="alert alert-warning">
                No comments yet.
            </div>

        </div>

        <div th:each="comment : ${lesson.comments}">

            <div class="border rounded p-3 mb-3">

                <p th:text="${comment.text}"></p>

            </div>

        </div>

    </div>

    <div class="card shadow p-4">

        <h3 class="mb-4">Add Comment</h3>

        <form th:action="@{/comments/{id}(id=${lesson.id})}"
              th:object="${comment}"
              method="post">

            <div class="mb-3">

                <textarea th:field="*{text}"
                          class="form-control"
                          rows="4"
                          placeholder="Write your comment..."
                          required>
                </textarea>

            </div>

            <button type="submit" class="btn btn-primary">
                Submit Comment
            </button>

            <a href="/lessons" class="btn btn-secondary">
                Back
            </a>

        </form>

    </div>

</div>

</body>
</html>
